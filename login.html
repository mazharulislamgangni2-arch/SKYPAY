<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0757d8"><title>SKYPAY | Login & Register</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eaf4ff,#f7f9ff);font-family:Arial,sans-serif;color:#14233d;min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(100%,420px);background:white;border-radius:24px;padding:26px;box-shadow:0 18px 50px #164a941c}.logo{font-size:30px;font-weight:900;color:#0757d8;text-align:center;letter-spacing:1px}.sub{text-align:center;color:#64748b;margin:6px 0 24px}.tabs{display:flex;background:#edf4ff;padding:5px;border-radius:13px;margin-bottom:20px}.tabs button{flex:1;border:0;padding:12px;border-radius:10px;background:transparent;font-weight:700;color:#426080}.tabs button.active{background:#0757d8;color:white}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #d8e2f0;border-radius:12px;font-size:15px} .primary{width:100%;border:0;border-radius:13px;padding:15px;background:linear-gradient(90deg,#0757d8,#1598ed);color:white;font-weight:800;font-size:16px;margin-top:20px}.note{font-size:12px;color:#74839a;line-height:1.5;margin-top:16px}.msg{margin-top:12px;color:#0757d8;font-size:13px;text-align:center}</style></head>
<body><main class="card"><div class="logo">◉ SKYPAY</div><div class="sub">Smart Payment · Smart Life</div><div class="tabs"><button id="loginTab" class="active" onclick="show('login')">Login</button><button id="regTab" onclick="show('register')">Register</button></div>
<form onsubmit="event.preventDefault();document.getElementById('msg').textContent='Demo only: connect the secure backend to enable account access.'"><div id="nameWrap" hidden><label>Full name</label><input placeholder="Enter your name"></div><label>Bangladesh mobile number</label><input type="tel" placeholder="01XXXXXXXXX" pattern="01[0-9]{9}" required><label>Password</label><input type="password" placeholder="Enter password" minlength="6" required><div id="confirmWrap" hidden><label>Confirm password</label><input type="password" placeholder="Confirm password" minlength="6"></div><button class="primary" id="submit">Login</button><div class="msg" id="msg"></div></form><p class="note">This is a front-end preview. Real registration, OTP delivery, login security and account storage require a connected backend. Demo OTP is not sent by SMS.</p></main>
<script>function show(mode){let reg=mode==='register';document.getElementById('nameWrap').hidden=!reg;document.getElementById('confirmWrap').hidden=!reg;document.getElementById('submit').textContent=reg?'Create account':'Login';document.getElementById('loginTab').classList.toggle('active',!reg);document.getElementById('regTab').classList.toggle('active',reg);document.getElementById('msg').textContent='';}</script></body></html>
